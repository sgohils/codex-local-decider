[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-local-decider"
version = "0.1.0"
description = "CPU-first evolutionary decision models and measured advisory hooks for Codex"
requires-python = ">=3.13"
dependencies = ["numpy>=2.1,<3"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
local-decider = "local_decider.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
